name: Publish Prospect Dominion Core Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          python scripts/build_public_release.py
          archive="Prospect-Dominion-Core-v${version}.zip"
          checksum="${archive}.sha256"
          manifest="RELEASE_MANIFEST_v${version}.txt"
          python scripts/validate_public_release.py --archive "${archive}"
          sha256sum --check "${checksum}"
          test -s "${manifest}"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          archive="Prospect-Dominion-Core-v${version}.zip"
          checksum="${archive}.sha256"
          manifest="RELEASE_MANIFEST_v${version}.txt"
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" \
            --title "Prospect Dominion Core ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for release notes. This is a self-hosted pilot foundation, not a hosted multi-tenant SaaS product. Customer-data use requires environment-specific technical and security approval plus signed data-processing terms."
          gh release upload "${GITHUB_REF_NAME}" "${archive}" "${checksum}" "${manifest}" --clobber