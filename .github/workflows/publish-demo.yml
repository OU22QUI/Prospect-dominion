name: Publish Prospect Dominion Demo

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "scripts/validate_customer_config.py"
      - "scripts/audit_public_demo.py"
      - ".github/workflows/publish-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate public demo
        run: python scripts/validate_customer_config.py --env-file deploy/customer.env.example --check-public-demo
      - name: Audit public demo
        run: python scripts/audit_public_demo.py
      - name: Validate required demo assets
        run: |
          test -s demo/index.html
          test -s demo/tester.html
          test -s demo/styles.css
          test -s demo/script.js
          test -s demo/config.js
          test -s demo/favicon.svg
          test -s demo/og-preview.svg
          test -s demo/demo-data.json
          test -s demo/README.md
          test -s demo/demo/index.html
          test -s demo/pricing/index.html
          test -s demo/partners/index.html
          grep -Fq "Owned signal-to-action layer" demo/index.html
          grep -Fq "Book a walkthrough" demo/index.html
          grep -Fq "Simulation" demo/demo/index.html
          grep -Fq "scenarioChips" demo/script.js
          python -c "import json; json.load(open('demo/demo-data.json', encoding='utf-8'))"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo
      - id: deployment
        uses: actions/deploy-pages@v4
