name: Prospect Dominion CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd services/api
          python -m pip install -r requirements.txt

      - name: Start integration dependencies
        run: |
          cp deploy/customer.env.example .env
          docker compose -f docker-compose.yml -f docker-compose.override.yml --profile pilot up -d --build --wait

      - name: Run tests
        env:
          PD_TEST_PG_DSN: postgresql://aethonex:change-me-strong@127.0.0.1:5432/prospect_dominion
        run: |
          python -m pytest -q

      - name: Validate public demo and customer config
        run: |
          node --check demo/app.js
          node --check demo/script.js
          python scripts/audit_public_demo.py
          python scripts/validate_customer_config.py --env-file deploy/customer.env.example --check-public-demo

      - name: Verify deployment
        env:
          API_PORT: 8010
          PD_BASE_URL: http://127.0.0.1:8010
          PD_API_KEY: dev-local-key
        run: python scripts/verify_deployment.py

      - name: Tear down integration dependencies
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml --profile pilot down --remove-orphans
